<!DOCTYPE html>
<html>
<head>
    <title>Fruit Farm</title>

    <style>
        #garden {
            margin-top: 20px;
        }

        #garden img {
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>Fruit Farm</h1>

    <div>
        Rows:
        <input type="text" id="rows">

        Columns:
        <input type="text" id="columns">

        <br><br>

        <button onclick="grow()">Plant Garden</button>
    </div>

    <div id="garden"></div>

    <script>
        function grow() {

            var rows =
                parseInt(document.getElementById("rows").value);

            var columns =
                parseInt(document.getElementById("columns").value);

            var fruits = ["bmw.jpg", "bmw.jpg"];

            var garden = document.getElementById("garden");

            garden.innerHTML = "";

            for (var i = 0; i < rows; i++) {

                for (var j = 0; j < columns; j++) {

                    var random =
                        Math.floor(Math.random() * fruits.length);

                    garden.innerHTML +=
                        "<img src='" + fruits[random] +
                        "' width='100' height='100'>";
                }

                garden.innerHTML += "<br>";
            }
        }
    </script>

</body>
</html>
