name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Exp 12/FullStackStudentApp/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Exp 12/FullStackStudentApp/frontend
        run: npm ci

      - name: Build frontend
        working-directory: Exp 12/FullStackStudentApp/frontend
        run: npm run build

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          cp -R "Exp 12/FullStackStudentApp/frontend/dist/." "_site/Exp 12/FullStackStudentApp/frontend/"
          cp "Exp 12/FullStackStudentApp/frontend/dist/app.html" "_site/Exp 12/FullStackStudentApp/frontend/index.html"
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published experiment listing and app bundles
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const pageUrl = process.env.PAGE_URL.endsWith('/')
            ? process.env.PAGE_URL
            : `${process.env.PAGE_URL}/`;
          const rootUrl = new URL(pageUrl);
          const appUrl = new URL('Exp%2012/FullStackStudentApp/frontend/', rootUrl);

          async function fetchPublished(url) {
            let lastError;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              try {
                const response = await fetch(url, { cache: 'no-store' });
                if (response.ok) return response;
                lastError = new Error(`HTTP ${response.status} for ${url}`);
              } catch (error) {
                lastError = error;
              }
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            throw lastError;
          }

          const rootResponse = await fetchPublished(rootUrl);
          const rootHtml = await rootResponse.text();
          for (let number = 1; number <= 11; number += 1) {
            if (!new RegExp(`Experiment\\s+${number}(?:\\D|$)`).test(rootHtml)) {
              throw new Error(`Root experiment listing is missing Experiment ${number}`);
            }
          }
          if (!rootHtml.includes('href="Exp%2012/FullStackStudentApp/frontend/"')) {
            throw new Error('Root Experiment 12 link does not target the deployed app');
          }

          const appResponse = await fetchPublished(appUrl);
          const appHtml = await appResponse.text();
          if (appHtml.includes('/src/main.jsx')) {
            throw new Error('Pages is serving the raw Vite template instead of its production build');
          }

          const scriptPath = appHtml.match(/<script[^>]+src="([^"]+\.js)"/)?.[1];
          const stylePath = appHtml.match(/<link[^>]+rel="stylesheet"[^>]+href="([^"]+\.css)"/)?.[1];
          if (!scriptPath || !stylePath) {
            throw new Error('Published app HTML is missing its built JavaScript or CSS bundle');
          }

          const scriptResponse = await fetchPublished(new URL(scriptPath, appUrl));
          const script = await scriptResponse.text();
          if (!script.includes('Student Management System')) {
            throw new Error('Published JavaScript bundle does not contain the React application');
          }

          const styleResponse = await fetchPublished(new URL(stylePath, appUrl));
          const styles = await styleResponse.text();
          if (!styles.includes('.student-form')) {
            throw new Error('Published stylesheet does not contain the application styles');
          }

          await new Promise((resolve) => setTimeout(resolve, 30000));
          const stableAppUrl = new URL(appUrl);
          stableAppUrl.searchParams.set('_pages_check', Date.now());
          const stableAppResponse = await fetchPublished(stableAppUrl);
          const stableAppHtml = await stableAppResponse.text();
          if (stableAppHtml.includes('/src/main.jsx') || !stableAppHtml.includes(scriptPath)) {
            throw new Error('The published app was replaced after the Actions deployment');
          }

          const stableRootUrl = new URL(rootUrl);
          stableRootUrl.searchParams.set('_pages_check', Date.now());
          const stableRootResponse = await fetchPublished(stableRootUrl);
          const stableRootHtml = await stableRootResponse.text();
          if (!stableRootHtml.includes('href="Exp%2012/FullStackStudentApp/frontend/"')) {
            throw new Error('The root experiment listing changed after the Actions deployment');
          }

          console.log(`Verified root listing and React bundles at ${appUrl}`);
          NODE
