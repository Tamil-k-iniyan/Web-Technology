<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
</head>

<body>
<h1>Student Details</h1>
<div id="result"></div>
<script>
var students = [
    {
        name: "John",
        r_num: "URK24CS1124",
        dob: 1995
    },

    {
        name: "Joseph",
        r_num: "URK24CS1122",
        dob: 1998
    },

    {
        name: "David",
        r_num: "URK24CS1125",
        dob: 2002
    },

    {
        name: "Peter",
        r_num: "URK24CS1128",
        dob: 2004
    }

];
var output = "";
for (var i = 0; i < students.length; i++) {
    output +=
        students[i].name +
        "'s Register Number is " +
        students[i].r_num +
        "<br>";
    if (students[i].dob < 2000) {

        output += "Born before 2000<br><br>";

    }
    else {

        output += "Born after 2000<br><br>";

    }
}
document.getElementById("result").innerHTML = output;
</script>
</body>
</html>
