<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
</head>

<body>

<h1>Digital Clock!</h1>

<h2 id="time"></h2>

<script>

function display() {

    var d = new Date();

    var hour = d.getHours();
    var minute = d.getMinutes();
    var second = d.getSeconds();

    document.getElementById("time").innerHTML =
        hour + ":" + minute + ":" + second;
}

setInterval(display, 1000);

display();

</script>

</body>
</html>
